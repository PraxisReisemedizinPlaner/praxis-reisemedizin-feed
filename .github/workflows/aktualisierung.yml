name: Reisemedizin – CDC-Meldungen taeglich aktualisieren

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'refresh_international_alerts.py'
      - 'country_profiles_v1.json'
      - 'development/v16/**'
      - 'website/**'
      - '.github/workflows/v16-qa.yml'
      - 'index.html'
      - '.github/workflows/aktualisierung.yml'

  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reisemedizin-pages
  cancel-in-progress: false

jobs:
  aktualisieren-und-veroeffentlichen:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Dateien aus dem Repository laden
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offizielle CDC-Meldungen abrufen
        run: python refresh_international_alerts.py

      - name: Medizinischen V16 Feed sicher erzeugen
        run: |
          python development/v16/validate_v16.py
          python development/v16/validate_route_requirements.py
          python development/v16/validate_jimdo_v24.py
          python -m unittest discover -s development/v16 -p 'test_*.py' -v
          mkdir -p _site
          python development/v16/export_public_v16.py --output _site/country_profiles_public_v16.json
          python development/v16/export_public_regions_v1.py --output _site/region_directory_public_v1.json
          python development/v16/export_public_regions_v2.py --output _site/region_directory_public_v2.json

      - name: V24 Browserdarstellung auf Desktop und Mobil pruefen
        timeout-minutes: 7
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install chromium --only-shell
          python development/v16/test_v24_browser.py

      - name: Webseite und aktuelle Daten vorbereiten
        run: |
          mkdir -p _site
          python development/v16/build_country_review_preview.py --output _site/reisecheck-laender-pruefung.html
          cp index.html public_international_alerts.json country_profiles_v1.json _site/
          cp development/v16/reisecheck_v16_vorschau.html _site/reisecheck-v16-vorschau.html
          cp website/ReiseCheck_Jimdo_V16.html _site/reisecheck-v16-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V18.html _site/reisecheck-v18-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V19.html _site/reisecheck-v19-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V20.html _site/reisecheck-v20-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V21.html _site/reisecheck-v21-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V22.html _site/reisecheck-v22-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V23.html _site/reisecheck-v23-jimdo-test.html
          cp website/ReiseCheck_Jimdo_V24.html _site/reisecheck-v24-jimdo-test.html
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path("website/ReiseCheck_Jimdo_V24.html").read_text(encoding="utf-8")
          Path("_site/reisecheck-v24-jimdo-css-test.html").write_text(re.sub(r"<style>.*?</style>","",source,count=1,flags=re.S),encoding="utf-8")
          PY

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Aktuelle Dateien bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Im Internet veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
